<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneyControl - Ailə Büdcəsi</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --primary-color: #2563eb;
      --success-color: #10b981;
      --danger-color: #ef4444;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 15px;
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border-color);
    }

    h1 {
      font-size: 1.4rem;
      color: var(--primary-color);
    }

    .auth-btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }

    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: #64748b;
    }

    input, select, button {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary-color);
    }

    .btn-submit {
      background-color: var(--success-color);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .summary-box {
      background: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }

    .summary-box span {
      display: block;
      font-size: 0.8rem;
      color: #64748b;
    }

    .summary-box strong {
      font-size: 1.2rem;
    }

    .progress-bar-bg {
      background: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-bar-fill {
      background: var(--primary-color);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .history-list {
      list-style: none;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .item-details span {
      display: block;
      font-size: 0.8rem;
      color: #64748b;
    }

    .item-amount {
      font-weight: bold;
      color: var(--danger-color);
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--danger-color);
      cursor: pointer;
      font-size: 1rem;
      width: auto;
      padding: 4px 8px;
    }

    .backup-section {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>💸 MoneyControl</h1>
    <div id="auth-container">
      <button class="auth-btn" id="login-btn">Google ilə Giriş</button>
    </div>
  </header>

  <!-- Büdcə Xülasəsi Card -->
  <div class="card">
    <div class="summary-grid">
      <div class="summary-box">
        <span>Aylıq Büdcə</span>
        <strong id="display-budget">0.00 ₼</strong>
      </div>
      <div class="summary-box">
        <span>Cəmi Xərc</span>
        <strong id="display-expense" style="color: var(--danger-color);">0.00 ₼</strong>
      </div>
    </div>
    <div>
      <div style="display: flex; justify-content: space-between; font-size: 0.8rem;">
        <span>İstifadə olunub: <span id="progress-percent">0%</span></span>
        <span>Qalıq: <strong id="display-remaining">0.00 ₼</strong></span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </div>
  </div>

  <!-- Büdcə Təyin Etme -->
  <div class="card">
    <form id="budget-form">
      <div class="form-group">
        <label for="budget-input">⚙️ Aylıq Büdcə Yarat / Dəyiş (₼)</label>
        <input 
          type="number" 
          id="budget-input" 
          placeholder="0.00" 
          inputmode="decimal" 
          step="0.01" 
          min="0" 
          required 
        />
      </div>
      <button type="submit" class="btn-submit">Büdcəni Yadda Saxla</button>
    </form>
  </div>

  <!-- Yeni Xərc Əlavə Et -->
  <div class="card">
    <h3>➕ Yeni Xərc Əlavə Et</h3>
    <form id="expense-form" style="margin-top: 10px;">
      <div class="form-group">
        <label for="expense-date">📅 Tarix</label>
        <input type="date" id="expense-date" required />
      </div>

      <div class="form-group">
        <label for="expense-person">👤 Şəxs</label>
        <select id="expense-person" required>
          <option value="Javid">👨‍💼 Javid</option>
          <option value="Turanə">👩‍💼 Turanə</option>
        </select>
      </div>

      <div class="form-group">
        <label for="expense-amount">💰 Məbləğ (₼)</label>
        <!-- Yalnız rəqəm klaviaturasını açan yenilənmiş input -->
        <input 
          type="number" 
          id="expense-amount" 
          placeholder="0.00" 
          inputmode="decimal" 
          step="0.01" 
          min="0" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="expense-category">🏷️ Kateqoriya</label>
        <select id="expense-category" required>
          <option value="Ərzaq / Market">🛒 Ərzaq / Market</option>
          <option value="Kommunal / Ev">🏠 Kommunal / Ev</option>
          <option value="Uşaqlar">👶 Uşaqlar</option>
          <option value="Nəqliyyat / Yanacaq">🚗 Nəqliyyat / Yanacaq</option>
          <option value="Restoran / Əyləncə">🍽️ Restoran / Əyləncə</option>
          <option value="Səhiyyə / Aptek">💊 Səhiyyə / Aptek</option>
          <option value="Digər">📦 Digər</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">Xərci Əlavə Et</button>
    </form>
  </div>

  <!-- Xərc Tarixçəsi -->
  <div class="card">
    <h3>📜 Xərc Tarixçəsi</h3>
    <ul class="history-list" id="history-list" style="margin-top: 10px;">
      <!-- Dinamik siyahı buraya düşəcək -->
    </ul>
  </div>

  <!-- Backup & Restore -->
  <div class="card">
    <h3>💾 Data Ehtiyat Nüsxəsi (JSON)</h3>
    <div class="backup-section">
      <button class="btn-secondary" id="export-btn">JSON Yüklə</button>
      <button class="btn-secondary" id="import-btn">JSON Bərpa Et</button>
      <input type="file" id="import-file" accept=".json" style="display: none;" />
    </div>
  </div>

  <!-- Firebase Scriptləri -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, deleteDoc, query, orderBy, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Konfiqurasiyası
   const firebaseConfig = {

  apiKey: "AIzaSyAXTdMzt9pcWqwurrZRPZKpmO2i3ssCdmU",

  authDomain: "moneycontrol-b3318.firebaseapp.com",

  databaseURL: "https://moneycontrol-b3318-default-rtdb.europe-west1.firebasedatabase.app",

  projectId: "moneycontrol-b3318",

  storageBucket: "moneycontrol-b3318.firebasestorage.app",

  messagingSenderId: "1024118327948",

  appId: "1:1024118327948:web:e89a1bcd534a08aafa49a9",

  measurementId: "G-BHZLQJMZFN"

};



    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // Dom elementləri
    const authContainer = document.getElementById("auth-container");
    const budgetForm = document.getElementById("budget-form");
    const expenseForm = document.getElementById("expense-form");
    const historyList = document.getElementById("history-list");
    const expenseAmountInput = document.getElementById("expense-amount");
    const budgetInput = document.getElementById("budget-input");

    // Bugünkü tarixi avtomatik daxil etmək
    document.getElementById("expense-date").valueAsDate = new Date();

    // Məbləğ xanalarına hərf yazılmasının qarşısını JS səviyyəsində də almaq
    [expenseAmountInput, budgetInput].forEach(input => {
      input.addEventListener("input", function() {
        this.value = this.value.replace(/[^0-9.]/g, '');
      });
    });

    let currentBudget = 0;
    let expensesList = [];

    // --- Google Authentication (Popup ilə) ---
    authContainer.addEventListener("click", (e) => {
      if (e.target.id === "login-btn") {
        signInWithPopup(auth, provider).catch(err => alert("Giriş xətası: " + err.message));
      } else if (e.target.id === "logout-btn") {
        signOut(auth);
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        authContainer.innerHTML = `
          <div class="user-info">
            <img src="${user.photoURL || 'https://via.placeholder.com/32'}" class="user-avatar" title="${user.displayName}">
            <button class="auth-btn" id="logout-btn" style="background:#64748b;">Çıxış</button>
          </div>
        `;
      } else {
        authContainer.innerHTML = `<button class="auth-btn" id="login-btn">Google ilə Giriş</button>`;
      }
    });

    // --- Firestore Real-Time Dinləyicilər ---
    
    // 1. Büdcəni Dinlə
    onSnapshot(doc(db, "settings", "budget"), (docSnap) => {
      if (docSnap.exists()) {
        currentBudget = docSnap.data().amount || 0;
      } else {
        currentBudget = 0;
      }
      updateUI();
    });

    // 2. Xərcləri Dinlə
    const q = query(collection(db, "expenses"), orderBy("date", "desc"));
    onSnapshot(q, (snapshot) => {
      expensesList = [];
      snapshot.forEach((doc) => {
        expensesList.push({ id: doc.id, ...doc.data() });
      });
      updateUI();
    });

    // --- UI Yeniləmə Funksiyası ---
    function updateUI() {
      const totalExpense = expensesList.reduce((sum, item) => sum + Number(item.amount), 0);
      const remaining = currentBudget - totalExpense;
      const percent = currentBudget > 0 ? Math.min(Math.round((totalExpense / currentBudget) * 100), 100) : 0;

      document.getElementById("display-budget").textContent = `${currentBudget.toFixed(2)} ₼`;
      document.getElementById("display-expense").textContent = `${totalExpense.toFixed(2)} ₼`;
      document.getElementById("display-remaining").textContent = `${remaining.toFixed(2)} ₼`;
      document.getElementById("progress-percent").textContent = `${percent}%`;
      
      const fill = document.getElementById("progress-fill");
      fill.style.width = `${percent}%`;
      fill.style.backgroundColor = percent >= 90 ? "var(--danger-color)" : "var(--primary-color)";

      // Tarixçəni doldur
      historyList.innerHTML = "";
      expensesList.forEach(item => {
        const li = document.createElement("li");
        li.className = "history-item";
        li.innerHTML = `
          <div class="item-details">
            <strong>${item.category} (${item.person})</strong>
            <span>${item.date}</span>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="item-amount">-${Number(item.amount).toFixed(2)} ₼</span>
            <button class="btn-delete" data-id="${item.id}">🗑️</button>
          </div>
        `;
        historyList.appendChild(li);
      });
    }

    // --- Form Təqdimatları (Add & Set) ---

    // Büdcə təyin et
    budgetForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const val = parseFloat(budgetInput.value);
      if (!isNaN(val)) {
        await setDoc(doc(db, "settings", "budget"), { amount: val });
        budgetInput.value = "";
      }
    });

    // Xərc əlavə et
    expenseForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const date = document.getElementById("expense-date").value;
      const person = document.getElementById("expense-person").value;
      const amount = parseFloat(expenseAmountInput.value);
      const category = document.getElementById("expense-category").value;

      if (date && amount) {
        await addDoc(collection(db, "expenses"), {
          date,
          person,
          amount,
          category,
          createdAt: new Date()
        });
        expenseAmountInput.value = "";
      }
    });

    // Xərc sil
    historyList.addEventListener("click", async (e) => {
      if (e.target.classList.contains("btn-delete")) {
        const id = e.target.getAttribute("data-id");
        if (confirm("Bu xərci silmək istədiyinizdən əminsiniz?")) {
          await deleteDoc(doc(db, "expenses", id));
        }
      }
    });

    // --- JSON Export & Import ---
    document.getElementById("export-btn").addEventListener("click", () => {
      const data = { budget: currentBudget, expenses: expensesList };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `MoneyControl_Backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    });

    document.getElementById("import-btn").addEventListener("click", () => {
      document.getElementById("import-file").click();
    });

    document.getElementById("import-file").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (event) => {
        try {
          const importedData = JSON.parse(event.target.result);
          if (importedData.budget !== undefined) {
            await setDoc(doc(db, "settings", "budget"), { amount: importedData.budget });
          }
          if (Array.isArray(importedData.expenses)) {
            for (const item of importedData.expenses) {
              await addDoc(collection(db, "expenses"), {
                date: item.date,
                person: item.person,
                amount: item.amount,
                category: item.category,
                createdAt: new Date()
              });
            }
          }
          alert("Məlumatlar uğurla bərpa olundu!");
        } catch (err) {
          alert("Fayl oxunarkən xəta baş verdi.");
        }
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
